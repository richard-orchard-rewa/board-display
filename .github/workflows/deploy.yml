name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # The server only uses Node built-ins, so ship just the built client, server and package.json.
      - name: Stage package
        run: |
          mkdir pkg
          cp -r dist server package.json pkg/

      - uses: azure/webapps-deploy@v3
        with:
          app-name: rawa-board-display
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: pkg
